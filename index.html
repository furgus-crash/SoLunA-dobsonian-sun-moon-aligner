<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoLunA - Solar & Lunar Alignment</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --accent-orange: #ff9f0a;
            --accent-blue: #0a84ff;
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            --green: #30d158;
            --border: #2c2c2e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 20px;
            margin: 0;
        }
        .btn {
            background-color: var(--green);
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
        }
        .btn-secondary {
            background-color: #2c2c2e;
            color: var(--text-main);
        }
        .btn-row {
            display: flex;
            gap: 10px;
        }
        .radar-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: radial-gradient(circle, #1c2538 0%, #0f172a 100%);
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        /* Radar Grid Lines */
        .radar-container::before {
            content: '';
            position: absolute;
            width: 70%;
            height: 70%;
            border: 1px dashed rgba(255,255,255,0.15);
            border-radius: 50%;
        }
        .radar-crosshair-h {
            position: absolute;
            width: 100%;
            height: 1px;
            background-color: rgba(255,255,255,0.15);
        }
        .radar-crosshair-v {
            position: absolute;
            height: 100%;
            width: 1px;
            background-color: rgba(255,255,255,0.15);
        }
        .target-dot {
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: var(--accent-orange);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-orange);
            transform: translate(-50%, -50%);
            transition: transform 0.1s linear;
        }
        .center-reticle {
            position: absolute;
            width: 16px;
            height: 16px;
            border: 2px solid var(--accent-orange);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            left: 50%;
            top: 50%;
        }
        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }
        .telemetry-box {
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 8px;
        }
        .telemetry-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .telemetry-value {
            font-size: 15px;
            font-weight: 600;
        }
        .status-text {
            text-align: center;
            font-size: 13px;
            color: var(--accent-orange);
            font-weight: 500;
        }
        .guidance-box {
            background: rgba(255, 159, 10, 0.1);
            border: 1px solid rgba(255, 159, 10, 0.3);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }
        .guidance-title {
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--accent-orange);
            font-weight: 700;
            margin-bottom: 4px;
        }
        .guidance-msg {
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Bar -->
    <div class="card header-row">
        <div style="display: flex; align-items: center; gap: 10px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#0a84ff"/><path d="M12 2a10 10 0 0 1 10 10h-10V2z" fill="#ff9f0a"/></svg>
            <h1>SoLunA</h1>
        </div>
        <div style="display: flex; gap: 6px;">
            <button class="btn" style="padding: 8px 12px; font-size: 13px;" id="modeSun">Sun</button>
            <button class="btn btn-secondary" style="padding: 8px 12px; font-size: 13px;" id="modeMoon">Moon</button>
        </div>
    </div>

    <!-- Radar Display Card -->
    <div class="card">
        <div class="radar-container" id="radarArea">
            <div class="radar-crosshair-h"></div>
            <div class="radar-crosshair-v"></div>
            <div class="center-reticle"></div>
            <div class="target-dot" id="targetDot" style="left: 30%; top: 50%;"></div>
        </div>
        <div class="status-text" id="statusText">● Aligning Scope...</div>
        
        <div class="guidance-box">
            <div class="guidance-title">HANDHELD OPERATOR GUIDANCE</div>
            <div class="guidance-msg" id="guidanceMsg">Nudge front opening: RIGHT</div>
        </div>
    </div>

    <!-- Bluetooth Control Card -->
    <div class="card">
        <div class="header-row">
            <span style="font-size: 13px; font-weight: 600; color: var(--text-muted);" id="btDeviceName">WITMOTION WT9011DCL BLE</span>
            <span style="font-size: 13px; font-weight: 600; color: var(--green);" id="btStatus">DISCONNECTED</span>
        </div>
        <div class="btn-row">
            <button class="btn" id="btConnectBtn" style="background-color: var(--green);">Connect Sensor</button>
            <button class="btn btn-secondary" id="btZeroBtn">⊙ Sync / Zero</button>
        </div>
        
        <div class="telemetry-grid">
            <div class="telemetry-box">
                <div class="telemetry-label">PITCH (ALT)</div>
                <div class="telemetry-value" id="valPitch">0.0°</div>
            </div>
            <div class="telemetry-box">
                <div class="telemetry-label">ROLL</div>
                <div class="telemetry-value" id="valRoll">0.0°</div>
            </div>
            <div class="telemetry-box">
                <div class="telemetry-label">YAW (AZ)</div>
                <div class="telemetry-value" id="valYaw">0.0°</div>
            </div>
        </div>
    </div>

    <!-- GPS & Ephemeris Card -->
    <div class="card">
        <div class="header-row">
            <span style="font-size: 13px; font-weight: 600; color: var(--text-muted);">GPS & EPHEMERIS</span>
            <span style="font-size: 13px; font-weight: 600; color: var(--accent-orange);">GPS LOCKED</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 14px;">
            <span style="color: var(--text-muted);">Observer GPS:</span>
            <span id="observerGps">44.9146° N, 93.2604° W</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 14px;">
            <span style="color: var(--text-muted);">Target Azimuth:</span>
            <span id="targetAz">80.28°</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 14px;">
            <span style="color: var(--text-muted);">Target Altitude:</span>
            <span id="targetAlt">0.00°</span>
        </div>
        <button class="btn btn-secondary" style="width: 100%; margin-top: 4px;">Force GPS Lock</button>
    </div>
</div>

<script>
    // WitMotion BLE State Variables & Logic Fixes
    let bluetoothDevice = null;
    let bluetoothCharacteristic = null;

    let rawPitch = 0, rawRoll = 0, rawYaw = 0;
    let zeroPitch = 0, zeroRoll = 0, zeroYaw = 0;

    const connectBtn = document.getElementById('btConnectBtn');
    const zeroBtn = document.getElementById('btZeroBtn');
    const btStatus = document.getElementById('btStatus');
    
    const valPitch = document.getElementById('valPitch');
    const valRoll = document.getElementById('valRoll');
    const valYaw = document.getElementById('valYaw');
    const targetDot = document.getElementById('targetDot');

    connectBtn.addEventListener('click', async () => {
        try {
            btStatus.textContent = "CONNECTING...";
            btStatus.style.color = varColor('--accent-orange');

            // Request BLE device filtering for WitMotion or standard UART services
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [
                    { namePrefix: 'WT' },
                    { namePrefix: 'Wit' },
                    { services: ['0000ffe0-0000-1000-8000-00805f9b34fb'] }
                ],
                optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb', '0000ffe1-0000-1000-8000-00805f9b34fb']
            });

            const server = await bluetoothDevice.gatt.connect();
            
            // Attempt to locate standard Nordic UART or WitMotion primary service
            let service;
            try {
                service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
            } catch (e) {
                // Fallback to whatever primary service is available if FFE0 isn't explicit
                const services = await server.getPrimaryServices();
                service = services[0];
            }

            const characteristics = await service.getCharacteristics();
            // Find the characteristic that supports notifications
            bluetoothCharacteristic = characteristics.find(c => c.properties.notify || c.properties.indicate);
            
            if (!bluetoothCharacteristic) {
                // Fallback to first characteristic if none explicitly flagged notify
                bluetoothCharacteristic = characteristics[0];
            }

            await bluetoothCharacteristic.startNotifications();
            bluetoothCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

            btStatus.textContent = "CONNECTED";
            btStatus.style.color = "var(--green)";
            connectBtn.textContent = "Disconnect";
            connectBtn.style.backgroundColor = "#ff453a";

        } catch (error) {
            console.error("BLE Connection failed:", error);
            btStatus.textContent = "FAILED";
            btStatus.style.color = "#ff453a";
        }
    });

    zeroBtn.addEventListener('click', () => {
        // Zero/Sync current orientation offset
        zeroPitch = rawPitch;
        zeroRoll = rawRoll;
        zeroYaw = rawYaw;
        
        // Snap dot to center on sync
        targetDot.style.left = "50%";
        targetDot.style.top = "50%";
    });

    function handleIncomingData(event) {
        const value = event.target.value;
        
        // Robust byte inspection for WitMotion data packets (looking for header 0x55)
        if (value.byteLength >= 11) {
            const bytes = new Uint8Array(value.buffer);
            for (let i = 0; i < bytes.length - 10; i++) {
                if (bytes[i] === 0x55) {
                    const packetType = bytes[i+1];
                    // Angle packet type is usually 0x53
                    if (packetType === 0x53) {
                        const rollBytes = (bytes[i+3] << 8) | bytes[i+2];
                        const pitchBytes = (bytes[i+5] << 8) | bytes[i+4];
                        const yawBytes = (bytes[i+7] << 8) | bytes[i+6];

                        rawRoll = sign16(rollBytes) / 32768.0 * 180.0;
                        rawPitch = sign16(pitchBytes) / 32768.0 * 180.0;
                        rawYaw = sign16(yawBytes) / 32768.0 * 180.0;
                    }
                }
            }
        }

        // Apply zero offset
        const adjustedPitch = rawPitch - zeroPitch;
        const adjustedYaw = rawYaw - zeroYaw;

        // Update UI Text Readouts
        valPitch.textContent = adjustedPitch.toFixed(1) + "°";
        valRoll.textContent = (rawRoll - zeroRoll).toFixed(1) + "°";
        valYaw.textContent = adjustedYaw.toFixed(1) + "°";

        // Update Radar Position dynamically based on live sensor feed
        const xPos = 50 + (adjustedYaw * 2); // Scale factor for visual feedback
        const yPos = 50 - (adjustedPitch * 2);
        targetDot.style.left = Math.max(5, Math.min(95, xPos)) + "%";
        targetDot.style.top = Math.max(5, Math.min(95, yPos)) + "%";
    }

    function sign16(num) {
        return (num & 0x8000) ? num - 0x10000 : num;
    }

    function varColor(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name);
    }
</script>

</body>
</html>
